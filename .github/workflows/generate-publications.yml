name: Generate publications

on:
  push:
    branches: [master, main]
    paths:
      - "_bibliography/references.bib"
      - "scripts/generate_publications.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate publication pages
        run: python3 scripts/generate_publications.py
      - name: Commit generated records
        run: |
          if git diff --quiet -- _publications; then
            echo "Publication records are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _publications
          git commit -m "Regenerate publications from BibTeX"
          git push
